<!DOCTYPE html>
<html>
    
    <head>
        
    <title>Icon Template Square</title>
        
        <script src="https://cdnjs.cloudflare.com/ajax/libs/buzz/1.2.0/buzz.min.js"></script>
        
        <style>
                 body {
    background-color: #9acdd1; /* blue */
}

        
.row{
    width:720px;
    margin: 10px auto;
}

.image-container {
    display: table-cell;
    vertical-align: middle;
    padding:25px;
}

/* wrapper for stacked images */
.img-wrapper {
    position: relative;
    width: 180px;
    height: 180px;
    overflow: visible;
    cursor: pointer;
}

.img-wrapper img {
    position: absolute;
    width: 100%;
    height: 100%;
    top: 0;
    left: 0;
    transition: opacity 0.4s ease, transform 0.4s ease;
}

/* default image */
.img-default {
    opacity: 1;
    z-index: 1;
}

/* hover image */
.img-hover {
    opacity: 0;
    z-index: 2;
}

/* hover effect */
.img-wrapper:hover .img-hover {
    opacity: 1;
    transform: scale(1.08);
}

.img-wrapper:hover .img-default {
    opacity: 0;
    transform: scale(1.08);
}
</style>



    </head>
    

    <body>
   

         <div class="row">
    <div class="image-container">
        <div class="img-wrapper" id="img1">
            <img class="img-default" src="img/icon1.png">
            <img class="img-hover" src="img/icon1alt.png">
        </div>
    </div>

    <div class="image-container">
        <div class="img-wrapper" id="img2">
            <img class="img-default" src="img/icon2.png">
            <img class="img-hover" src="img/icon2alt.png">
        </div>
    </div>

    <div class="image-container">
        <div class="img-wrapper" id="img3">
            <img class="img-default" src="img/icon3.png">
            <img class="img-hover" src="img/icon3alt.png">
        </div>
    </div>
</div>
        </div>

</div>

</div>
        
        <script>
            var sound1 = new buzz.sound("sound/sound1.wav");
            var sound2 = new buzz.sound("sound/sound2.wav");
            var sound3 = new buzz.sound("sound/sound3.wav");
            var sound4 = new buzz.sound("sound/sound4.wav");
            var sound5 = new buzz.sound("sound/sound5.wav");

            var sound7 = new buzz.sound("sound/sound7.wav");
            var sound8 = new buzz.sound("sound/sound8.wav");
            var sound9 = new buzz.sound("sound/sound9.wav");
     
            window.onload = function() {
